# Single-origin reverse proxy.
#
# The browser must reach the frontend and the API on one origin: served from
# separate hosts, a remote client would try to call localhost:8000 for the API
# and get nothing, and cross-site cookies would be refused anyway.
#
# Architecture section 6.1. This is the development-grade version; TLS and the
# hardened production config land in Phase 31.

upstream montra_web {
    server web:3000;
}

upstream montra_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Uploads and long-running requests.
    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API first: a more specific prefix than the catch-all below.
    location /api/ {
        proxy_pass http://montra_api;
        proxy_read_timeout 60s;
    }

    # Next.js dev server needs the websocket upgrade for hot reload.
    location / {
        proxy_pass http://montra_web;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
