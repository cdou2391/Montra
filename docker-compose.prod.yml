# Production stack.
#
# Differs from the development compose in four ways that matter:
#
#   * The image is the artifact. No bind mounts, no --reload, no dev server —
#     what was tested is what runs.
#   * Only the proxy publishes a port. Postgres, Redis and MinIO are reachable
#     on the internal network and from nowhere else, which is the single-host
#     equivalent of the plan's firewall rule.
#   * Migrations run as their own one-shot job before the API starts, rather
#     than by hand afterwards.
#   * Containers restart on their own, and their logs are capped so a noisy
#     one cannot fill the disk.
#   * Every service has a memory ceiling, a CPU ceiling and a process cap. On a
#     single host a container without limits can take the database down with
#     it, and the database is the one process whose death costs data rather
#     than uptime. The numbers below are sized for a shared 2-core, 4 GB box —
#     they are ceilings, not reservations, so they deliberately sum to more
#     than the machine has.
#
# Usage:
#
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# The same file runs UAT — the production images and topology with an
# environment that permits plain HTTP:
#
#   docker compose -p montra-uat --env-file .env.uat -f docker-compose.prod.yml up -d --build
#
# Nothing here names its containers, so the two can run side by side under
# different project names.
#
# --env-file is not optional. Compose interpolates ${...} in this file from the
# default .env, which is the development one; without it Postgres would be
# initialised with the development password while the API used the production
# one, and every connection would fail authentication.
#
# The two application images default to the tags a local build produces, so the
# command above is unchanged. scripts/deploy.sh overrides MONTRA_API_IMAGE and
# MONTRA_WEB_IMAGE to run published images from Docker Hub instead of building.

x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Deliberately no `ports`. Nothing outside this network reaches the
    # database, so it cannot be probed from the host or the internet.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
          pids: 128
        reservations:
          memory: 192m

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *logging
    # noeviction, not an LRU policy: this is Celery's broker, and evicting a
    # key under memory pressure silently discards a queued task. Refusing the
    # write instead surfaces the problem where it can be seen.
    command: redis-server --maxmemory 96mb --maxmemory-policy noeviction --save 60 1000
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
          pids: 64
        reservations:
          memory: 64m

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    logging: *logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.5"
          pids: 96

  # Runs once and exits. The API waits for it to succeed, so the schema is
  # never behind the code that expects it — and a failed migration stops the
  # deploy instead of leaving a half-migrated database serving traffic.
  migrate:
    build:
      context: ./backend
      target: runner
    image: ${MONTRA_API_IMAGE:-montra-api:prod}
    restart: "no"
    logging: *logging
    command: alembic upgrade head
    env_file: ${MONTRA_ENV_FILE:-.env.production}
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "1.0"
          pids: 64
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: runner
    image: ${MONTRA_API_IMAGE:-montra-api:prod}
    restart: unless-stopped
    logging: *logging
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: ${MONTRA_ENV_FILE:-.env.production}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "1.0"
          pids: 96

  worker:
    build:
      context: ./backend
      target: runner
    image: ${MONTRA_API_IMAGE:-montra-api:prod}
    restart: unless-stopped
    logging: *logging
    # --concurrency pinned rather than left to default. Celery's prefork pool
    # otherwise forks once per CPU, so the same image quietly uses eight times
    # the memory on a bigger host — and, worse, multiplies its database pool by
    # the same factor. Five scheduled jobs a day do not need more than two.
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    env_file: ${MONTRA_ENV_FILE:-.env.production}
    environment:
      # Per fork, not per container. Two forks at 2+3 is ten connections; the
      # inherited default would have been sixty, against a server that allows
      # a hundred in total.
      DB_POOL_SIZE: 2
      DB_MAX_OVERFLOW: 3
    deploy:
      resources:
        limits:
          memory: 320m
          cpus: "0.75"
          pids: 96
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.worker.celery_app", "inspect", "ping", "-d", "celery@$${HOSTNAME}"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    build:
      context: ./backend
      target: runner
    image: ${MONTRA_API_IMAGE:-montra-api:prod}
    restart: unless-stopped
    logging: *logging
    command: celery -A app.worker.celery_app beat --loglevel=info
    env_file: ${MONTRA_ENV_FILE:-.env.production}
    environment:
      # Beat only publishes messages; it never runs a task.
      DB_POOL_SIZE: 1
      DB_MAX_OVERFLOW: 2
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
          pids: 64
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      target: runner
      args:
        # Inlined into the bundle at build time. Relative, so the client calls
        # whichever origin served it.
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    image: ${MONTRA_WEB_IMAGE:-montra-web:prod}
    restart: unless-stopped
    logging: *logging
    environment:
      API_ORIGIN: http://api:8000
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 320m
          cpus: "0.75"
          pids: 96
    depends_on:
      - api

  # The only service that publishes a port. Everything else is reachable only
  # from inside this network.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/montra.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.5"
          pids: 64
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
